# Provider-side exceptions are narrowly scoped by service title and operation path.
# The contract still runs and verifies schema/mapping data; only the exact
# documented provider response below is treated as an expected failure.

[[provider_exception]]
service_title = "INSPIRE Flurstücke Saarland (Open Data)"
path = "/gdi-sl/inspirewfs_Flurstuecke_Grundstuecke_ALKIS"
status = 500
body_includes = "pool error Timeout waiting for idle object"
reason = "Saarland WFS backend cannot acquire a JDBC connection from its exhausted connection pool."
schema_url = "https://inspire.ec.europa.eu/schemas/cp/4.0/CadastralParcels.xsd"
