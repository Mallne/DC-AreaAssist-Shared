name: Publish SNAPSHOT

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate SNAPSHOT version
        id: version
        run: |
          BASE_VERSION=$(grep 'VERSION_NAME' gradle.properties | cut -d= -f2 | tr -d ' ' | sed 's/-SNAPSHOT//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "version=${BASE_VERSION}.${COMMIT_COUNT}-build.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish SNAPSHOT
        run: ./gradlew --no-daemon publish -PVERSION_NAME="${{ steps.version.outputs.version }}"
        env:
          ORG_GRADLE_PROJECT_dc.username: ${{ secrets.NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_dc.password: ${{ secrets.NEXUS_PASSWORD }}
