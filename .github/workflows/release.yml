name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag matches VERSION_NAME
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep 'VERSION_NAME' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [ "$GRADLE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: gradle.properties VERSION_NAME ($GRADLE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish release
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon publish -PVERSION_NAME="$TAG_VERSION"
        env:
          ORG_GRADLE_PROJECT_dc.username: ${{ secrets.NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_dc.password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes --title ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
